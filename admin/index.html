<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>後台｜稅務小工具</title>
<link rel="icon" href="/favicon.png">
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&display=swap" onload="this.onload=null;this.rel='stylesheet'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&display=swap"></noscript>
<link rel="stylesheet" href="/assets/base.css?v=2026102703">
<link rel="stylesheet" href="/assets/nav.css?v=2026102703">
<style>
:root{--s1:#2554A6;--s2:#C8653A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--s1:#5A86D6;--s2:#D4724A}}
:root[data-theme="dark"]{--s1:#5A86D6;--s2:#D4724A}
.bar-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}
.ranges{display:flex;gap:6px;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:4px}
.ranges button{font:inherit;font-size:15px;border:0;background:transparent;color:var(--muted);min-height:36px;padding:0 12px;border-radius:7px;cursor:pointer}
.ranges button[aria-pressed="true"]{background:var(--surface);color:var(--fg);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:2px}
.kpi span{font-size:14px;color:var(--muted)}
.kpi b{font-size:28px;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi small{font-size:13px;color:var(--muted)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px}
h2.t{margin:0 0 10px;font-size:15px;color:var(--muted);letter-spacing:.1em;font-weight:700}
.legend{display:flex;gap:16px;font-size:14px;color:var(--muted);margin-bottom:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.legend i.l{height:3px;border-radius:2px;vertical-align:3px}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .grid line{stroke:var(--line)}
.chart .ax text{fill:var(--muted);font-size:11px}
.tip{position:absolute;pointer-events:none;background:var(--fg);color:var(--bg);font-size:13px;line-height:1.5;padding:6px 10px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .1s}
.tip.on{opacity:1}
table.rank{width:100%;border-collapse:collapse;font-size:15px}
table.rank td{padding:7px 4px;border-top:1px solid var(--line);vertical-align:middle}
table.rank tr:first-child td{border-top:0}
table.rank td.n{text-align:right;font-variant-numeric:tabular-nums;width:4.5em;color:var(--fg)}
table.rank .meter{height:6px;background:var(--accent-soft);border-radius:3px;margin-top:4px}
table.rank .meter i{display:block;height:100%;background:var(--s1);border-radius:3px}
.empty{color:var(--muted);font-size:15px;margin:0}
.fb-filter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.fb-item{border-top:1px solid var(--line);padding:14px 0;display:grid;gap:6px}
.fb-item:first-of-type{border-top:0}
.fb-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13.5px;color:var(--muted)}
.tag{display:inline-flex;align-items:center;min-height:24px;padding:0 9px;border-radius:99px;font-size:13px;background:var(--sunk);border:1px solid var(--line);color:var(--fg)}
.tag.new{background:var(--warm-soft);border-color:var(--warm);color:var(--fg);font-weight:700}
.fb-text{white-space:pre-wrap;word-break:break-word;margin:0}
.fb-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fb-row input{flex:1;min-width:180px;min-height:38px;font-size:15px}
.fb-row .btn{min-height:38px;font-size:14px}
.gate{max-width:440px}
</style>
</head>
<body>
<header class="site-head">
  <a class="site-brand" href="/"><img src="/icon-192.png" alt="">稅務小工具</a>
  <nav class="site-nav" aria-label="工具"></nav>
</header>
<div class="wrap">
  <div class="page-head bar-top">
    <div><h1>後台</h1><p id="who">流量、會員和意見回饋。只有管理員看得到。</p></div>
    <div class="ranges" role="group" aria-label="期間" id="ranges" hidden>
      <button type="button" data-d="7">7 天</button><button type="button" data-d="30" aria-pressed="true">30 天</button><button type="button" data-d="90">90 天</button>
    </div>
  </div>

  <section class="card gate" id="gate" hidden>
    <p id="gate-msg" style="margin:0 0 12px">請用管理員的 Google 帳號登入。</p>
    <div id="signin"></div>
  </section>

  <div id="dash" hidden style="display:grid;gap:24px">
    <div class="kpis" id="kpis"></div>

    <section class="card">
      <h2 class="t">每日流量</h2>
      <div class="legend"><span><i style="background:var(--s1)"></i>瀏覽次數</span><span><i class="l" style="background:var(--s2)"></i>不重複訪客</span></div>
      <div class="chart" id="chart"></div>
      <details class="more" style="margin-top:12px"><summary>看數字表</summary><div class="inner" id="table"></div></details>
    </section>

    <div class="two">
      <section class="card"><h2 class="t">熱門頁面</h2><div id="pages"></div></section>
      <section class="card"><h2 class="t">從哪裡來</h2><div id="refs"></div><h2 class="t" style="margin-top:18px">裝置</h2><div id="devs"></div></section>
    </div>

    <section class="card" id="fb">
      <h2 class="t">意見回饋</h2>
      <div class="fb-filter ranges" role="group" aria-label="篩選" id="fbf" style="width:max-content">
        <button type="button" data-s="new" aria-pressed="true">未處理</button><button type="button" data-s="done">已處理</button><button type="button" data-s="all">全部</button>
      </div>
      <div id="fblist"></div>
    </section>
    <p class="hint">流量只計真人瀏覽（排除搜尋引擎爬蟲），不用 Cookie、不存 IP；「不重複訪客」以每天為單位計算，跨天會重複計算同一人。</p>
  </div>
</div>
<script src="/assets/nav.js?v=2026102703"></script>
<script src="/assets/auth.js?v=2026102703"></script>
<script>
(function(){
  const $=s=>document.querySelector(s);
  const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const fmt=n=>Number(n||0).toLocaleString("zh-TW");
  const PAGE={"/":"首頁","/invoice-helper/":"手開發票","/rent-withholding/":"租金扣繳","/labor-report/":"勞報扣繳","/tax-included/":"含稅換算","/company-lookup/":"統編查詢","/labor-health/":"勞健保","/income-tax/":"綜所稅","/landlord-tax/":"房東報稅","/tax-calendar/":"報稅行事曆","/ledger/":"報稅帳本","/firm/":"記帳士事務所","/join/":"邀請加入","/privacy/":"隱私權政策"};
  let days=30, data=null, fbState="new";

  async function load(){
    try{ data=await TT_AUTH.api("/api/admin?days="+days); }
    catch(e){
      $("#dash").hidden=true; $("#ranges").hidden=true; $("#gate").hidden=false;
      if(e.status===401){ $("#gate-msg").textContent="請用管理員的 Google 帳號登入。"; TT_AUTH.button($("#signin"),()=>load(),m=>$("#gate-msg").textContent=m); }
      else if(e.status===403){ $("#gate-msg").textContent="這個帳號沒有後台權限。"; $("#signin").innerHTML=`<button class="btn" id="out">登出換帳號</button>`; $("#out").onclick=()=>TT_AUTH.logout().then(()=>location.reload()); }
      else $("#gate-msg").textContent=e.message;
      return;
    }
    $("#gate").hidden=true; $("#dash").hidden=false; $("#ranges").hidden=false;
    render();
  }

  function render(){
    const t=data.totals, m=data.members;
    const unread=data.feedback.filter(f=>f.status==="new").length;
    $("#kpis").innerHTML=[
      ["今天瀏覽",t.today.views,`訪客 ${fmt(t.today.visitors)} 人`],
      ["近 7 天瀏覽",t.d7.views,`訪客 ${fmt(t.d7.visitors)} 人次`],
      [`近 ${data.days} 天瀏覽`,t.period.views,`訪客 ${fmt(t.period.visitors)} 人次`],
      ["登入會員",m.total,`近 7 天登入 ${fmt(m.active7)}・新增 ${fmt(m.newInPeriod)}`],
      ["帳本",(m.spaces.personal||0)+(m.spaces.company||0)+(m.spaces.firm||0),`公司 ${fmt(m.spaces.company||0)}・事務所 ${fmt(m.spaces.firm||0)}${m.items!=null?`・共 ${fmt(m.items)} 筆帳`:""}`],
      ["未處理回饋",unread,`全部 ${fmt(data.feedback.length)} 則`],
    ].map(([a,b,c])=>`<div class="kpi"><span>${a}</span><b>${fmt(b)}</b><small>${c}</small></div>`).join("");
    chart(); ranks(); fb();
  }

  function chart(){
    const s=data.series, W=760, H=240, L=40, R=8, T=10, B=26, n=s.length;
    const max=Math.max(4,...s.map(r=>Math.max(r.views,r.visitors)));
    const step=Math.pow(10,Math.floor(Math.log10(max))), nice=Math.ceil(max/step)*step, ticks=[0,nice/2,nice];
    const x=i=>L+(W-L-R)*(i+.5)/n, y=v=>T+(H-T-B)*(1-v/nice), bw=Math.max(2,(W-L-R)/n-2);
    const every=Math.ceil(n/8);
    let g=`<g class="grid">${ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/>`).join("")}</g>`;
    g+=`<g class="ax">${ticks.map(v=>`<text x="${L-6}" y="${y(v)+4}" text-anchor="end">${fmt(v)}</text>`).join("")}`;
    g+=s.map((r,i)=>i%every===0||i===n-1?`<text x="${x(i)}" y="${H-6}" text-anchor="middle">${r.day.slice(5).replace("-","/")}</text>`:"").join("")+`</g>`;
    g+=s.map((r,i)=>{ const h=Math.max(0,y(0)-y(r.views)); return h?`<path d="M${x(i)-bw/2},${y(0)}v${-Math.max(0,h-Math.min(3,bw/2))}q0,${-Math.min(3,bw/2)} ${Math.min(3,bw/2)},${-Math.min(3,bw/2)}h${bw-2*Math.min(3,bw/2)}q${Math.min(3,bw/2)},0 ${Math.min(3,bw/2)},${Math.min(3,bw/2)}v${Math.max(0,h-Math.min(3,bw/2))}z" fill="var(--s1)"/>`:""; }).join("");
    g+=`<polyline fill="none" stroke="var(--surface)" stroke-width="5" stroke-linejoin="round" points="${s.map((r,i)=>`${x(i)},${y(r.visitors)}`).join(" ")}"/>`;
    g+=`<polyline fill="none" stroke="var(--s2)" stroke-width="2" stroke-linejoin="round" points="${s.map((r,i)=>`${x(i)},${y(r.visitors)}`).join(" ")}"/>`;
    g+=`<line id="cross" y1="${T}" y2="${y(0)}" stroke="var(--line-strong)" visibility="hidden"/>`;
    g+=s.map((r,i)=>`<rect x="${L+(W-L-R)*i/n}" y="${T}" width="${(W-L-R)/n}" height="${H-T-B}" fill="transparent" data-i="${i}"/>`).join("");
    $("#chart").innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="每日瀏覽次數與不重複訪客">${g}</svg><div class="tip" id="tip"></div>`;
    const tip=$("#tip"), cross=$("#cross"), svg=$("#chart svg");
    svg.addEventListener("pointermove",e=>{
      const i=e.target.dataset&&e.target.dataset.i; if(i==null){ return; }
      const r=s[i], k=svg.clientWidth/W;
      cross.setAttribute("x1",x(+i)); cross.setAttribute("x2",x(+i)); cross.setAttribute("visibility","visible");
      tip.innerHTML=`${r.day.replace(/-/g,"/")}<br>瀏覽 ${fmt(r.views)}・訪客 ${fmt(r.visitors)}${r.signups?`・新會員 ${r.signups}`:""}`;
      tip.style.left=Math.min(Math.max(x(+i)*k,70),svg.clientWidth-70)+"px"; tip.style.top=(y(Math.max(r.views,r.visitors))*k)+"px"; tip.classList.add("on");
    });
    svg.addEventListener("pointerleave",()=>{ tip.classList.remove("on"); cross.setAttribute("visibility","hidden"); });
    $("#table").innerHTML=`<table class="rank"><tbody>${s.slice().reverse().map(r=>`<tr><td>${r.day.replace(/-/g,"/")}</td><td class="n">${fmt(r.views)}</td><td class="n">${fmt(r.visitors)}</td><td class="n">${r.signups||""}</td></tr>`).join("")}</tbody></table><p class="hint">欄位：日期／瀏覽／訪客／新會員</p>`;
  }

  function rank(rows,label,key){
    if(!rows.length) return `<p class="empty">還沒有資料。</p>`;
    const max=Math.max(...rows.map(r=>r.v));
    return `<table class="rank"><tbody>${rows.map(r=>`<tr><td>${esc(label(r[key]))}<div class="meter"><i style="width:${Math.max(2,r.v/max*100)}%"></i></div></td><td class="n">${fmt(r.v)}</td></tr>`).join("")}</tbody></table>`;
  }
  function ranks(){
    $("#pages").innerHTML=rank(data.pages,p=>PAGE[p]?`${PAGE[p]}（${p}）`:p,"path");
    const REF={google:"Google 搜尋",bing:"Bing",yahoo:"Yahoo",facebook:"Facebook",line:"LINE",instagram:"Instagram",threads:"Threads",ptt:"PTT",dcard:"Dcard"};
    $("#refs").innerHTML=data.refs.length?rank(data.refs,r=>REF[r]||r,"ref"):`<p class="empty">目前都是直接打開（書籤、手打網址或 App 內連結）。</p>`;
    $("#devs").innerHTML=rank(data.devs,d=>d,"dev");
  }

  function fb(){
    const list=data.feedback.filter(f=>fbState==="all"||(fbState==="done"?f.status!=="new":f.status==="new"));
    $("#fblist").innerHTML=list.length?list.map(f=>`<div class="fb-item" data-id="${f.id}">
      <div class="fb-meta"><span class="tag ${f.status==="new"?"new":""}">${f.status==="new"?"未處理":f.status==="done"?"已處理":"略過"}</span><span class="tag">${esc(f.kind)}</span>
        <span>${new Date(f.ts).toLocaleString("zh-TW",{hour12:false})}</span><span>頁面：${esc(PAGE[f.page]||f.page||"")}</span>
        ${f.email?`<span>會員：${esc(f.name||"")} ${esc(f.email)}</span>`:""}${f.contact?`<span>聯絡：${esc(f.contact)}</span>`:""}</div>
      <p class="fb-text">${esc(f.text)}</p>
      <div class="fb-row"><input placeholder="處理備註（只有你看得到）" value="${esc(f.note||"")}" aria-label="處理備註">
        ${f.status==="new"?`<button class="btn primary" data-act="done">標為已處理</button><button class="btn" data-act="ignored">略過</button>`:`<button class="btn" data-act="new">改回未處理</button>`}
        <button class="btn link" data-act="delete">刪除</button></div>
    </div>`).join(""):`<p class="empty">${fbState==="new"?"沒有未處理的回饋。":"沒有回饋。"}</p>`;
  }

  $("#fblist").addEventListener("click",async e=>{
    const b=e.target.closest("[data-act]"); if(!b) return;
    const item=b.closest(".fb-item"), id=+item.dataset.id, note=item.querySelector("input").value, act=b.dataset.act;
    if(act==="delete"&&!confirm("刪除這則回饋？刪除後無法復原。")) return;
    b.disabled=true;
    try{
      if(act==="delete"){ await TT_AUTH.api("/api/admin",{action:"delete-feedback",id}); data.feedback=data.feedback.filter(f=>f.id!==id); }
      else { await TT_AUTH.api("/api/admin",{action:"feedback",id,status:act,note}); const f=data.feedback.find(f=>f.id===id); f.status=act; f.note=note; }
      render();
    }catch(err){ alert(err.message); b.disabled=false; }
  });
  $("#fbf").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return; fbState=b.dataset.s; $("#fbf").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b)); fb(); });
  $("#ranges").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return; days=+b.dataset.d; $("#ranges").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b)); load(); });
  load();
})();
</script>
</body>
</html>
