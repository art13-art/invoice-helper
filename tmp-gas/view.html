<!doctype html><meta charset="utf-8"><title>gas view</title>
<style>html,body{margin:0;height:100%}iframe{border:0;width:100%;height:100%;display:block}</style>
<iframe id="f"></iframe>
<script>
// Receives the Apps Script sources from the editor tab, builds doGet() with theme.gs and a fake google.script.run.
addEventListener('message',async e=>{
  const o=e.data||{}; if(!o.sources) return;
  const theme=o.noTheme?'function themeHtml_(){return ""}':await (await fetch('theme.gs?'+Date.now(),{cache:'no-store'})).text();
  const src=o.sources.filter(s=>s.indexOf('function themeHtml_')<0).join('\n');
  const Html={createHtmlOutput:h=>{const r={getContent:()=>h,setTitle(){return r},addMetaTag(){return r}};return r}};
  let html=new Function('HtmlService',src+'\n'+theme+'\nvar h=doGet().getContent();if(!/t-title/.test(h))h=h.replace("</body>",function(){return themeHtml_()+"</body>"});return h;')(Html);
  const cats=['餐飲','交通','住宿','生活用品','服飾','醫療','娛樂','美容／個人照護','採購／材料','辦公室用品採購','廣告行銷','人事薪資','租金','水電瓦斯','軟體／訂閱','設備','運費','手續費','稅費','保險','業務收入','其他','每月訂閱制'];
  const data={
    getTransactionPreview:{ok:true,category:o.cat||'餐飲',categories:cats},
    getAccountOptions:{banks:['國泰世華','台新 Richart'],cards:['玉山卡','國泰 CUBE 卡']},
    getSubscriptions:{today:'2026-10-26',items:[{id:'S1',version:'v',name:'ChatGPT',amount:600,day:5,payment:'信用卡',account:'玉山卡',active:true,notes:'',result:'2026-10 已記帳'}]},
    getRecentEntries:{ok:true,categories:cats,hasMore:true,nextCursor:{},entries:[
      {id:'a',version:'v',date:'2026-10-26',entity:'個人',flow:'支出',amount:680,category:'餐飲',payment:'信用卡',account:'玉山卡',text:'午餐 玉山卡',notes:'',voided:false},
      {id:'b',version:'v',date:'2026-10-25',entity:'個人',flow:'收入',amount:12800,category:'業務收入',payment:'銀行轉帳',account:'國泰世華',text:'課程收入',notes:'十月講座',voided:false},
      {id:'c',version:'v',date:'2026-10-24',entity:'個人',flow:'支出',amount:250,category:'美容／個人照護',payment:'待確認',account:'',text:'理髮',notes:'',voided:true,restorable:true}]},
    getCategoryManager:{categories:cats,protectedCategories:['每月訂閱制'],counts:{'餐飲':12,'交通':4}},
    saveEntry:{ok:true,entryId:'BK-1',version:'v',entity:'個人',flow:'支出',amount:680,category:'待確認',account:'玉山卡',status:'待確認',confirmReason:'無法判斷類別',originalText:'午餐 玉山卡'}
  };
  const shim='<script>window.__D='+JSON.stringify(data)+';window.google={script:{get run(){let ok=()=>{},fail=()=>{};const p=new Proxy({},{get(_,k){if(k==="withSuccessHandler")return f=>{ok=f;return p};if(k==="withFailureHandler")return f=>{fail=f;return p};return (...a)=>setTimeout(()=>ok(JSON.parse(JSON.stringify(window.__D[k]||{ok:true,message:"ok",categories:[]}))),30)}});return p}}};<\/script>';
  html=html.replace('<head>','<head><meta name="viewport" content="width=device-width,initial-scale=1">'+shim);
  if(o.dark)html=html.replace(/@media \(prefers-color-scheme:dark\)\{/g,'@media all{');
  html=html.replace('</body>','<script>'+(o.after||'')+'<\/script></body>');
  const f=document.getElementById('f'); f.onload=()=>parent.postMessage('rendered','*'); f.srcdoc=html;
});
parent.postMessage('view-ready','*');
</script>
